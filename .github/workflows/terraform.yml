name: Terraform

# Plan on every pull request, apply when changes land on main.
on:
  pull_request:
    paths:
      - "load-balancer/**"
      - "modules/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "load-balancer/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  # Cloudflare provider auth (manages the load balancers).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # R2 state backend auth.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # Find every load balancer config folder. Each folder under load-balancer/
  # is one load balancer, EXCEPT "engine" (the Terraform code) and
  # "load-balancer-configs" (the template you copy).
  discover:
    runs-on: ubuntu-latest
    outputs:
      lbs: ${{ steps.find.outputs.lbs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          lbs=$(find load-balancer -mindepth 1 -maxdepth 1 -type d \
            ! -name 'engine' ! -name 'load-balancer-configs' \
            -exec basename {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "lbs=$lbs" >> "$GITHUB_OUTPUT"
          echo "Discovered load balancers: $lbs"

  terraform:
    needs: discover
    if: needs.discover.outputs.lbs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lb: ${{ fromJson(needs.discover.outputs.lbs) }}
    defaults:
      run:
        working-directory: load-balancer/engine
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Collect -var-file arguments
        id: vars
        shell: bash
        run: |
          args=$(find "../${{ matrix.lb }}" -type f -name '*.tfvars' | sort \
            | sed 's/^/ -var-file=/' | tr -d '\n')
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Terraform Init (per-LB state)
        run: terraform init -reconfigure -input=false -backend-config="key=load-balancers/${{ matrix.lb }}.tfstate"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color ${{ steps.vars.outputs.args }} -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LB: ${{ matrix.lb }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('load-balancer/engine/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated) ...';
            const body = `#### Terraform Plan — load balancer \`${process.env.LB}\`\n`
              + `<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Only applies after the change is merged to main.
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
